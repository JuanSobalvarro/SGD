{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core_application/styles/style.css' %}">
    <title>SGD {% block title %}{% endblock %}</title>
</head>
<body>
  <header>
    <nav class="container-fluid">
      <div class="row navbar">  
        <div class="col-lg-1 col-sm-12">
          <ul class="nav">
            <li class="nav-item nav-button">
              <a class="nav-link" href="#">Inicio</a>
            </li>
          </ul>
        </div>
        <div class="col-lg-10 col-sm-12">
          <ul class="nav justify-content-center">
            <li class="nav-item nav-button">
              <a class="nav-link" >Noticias</a>
            </li>
            <li class="nav-item dropdown nav-button">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Deportes
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Ping pong</a></li>
                <li><a class="dropdown-item" href="#">Fútbol</a></li>
              </ul>
            </li>
            <li class="nav-item nav-button">
              <a class="nav-link" href="about.html">¿Quiénes somos?</a>
            </li>
            <li class="nav-item nav-button">
              <a class="nav-link">Calendario</a>
            </li>
            <li class="nav-item nav-button">
              <a class="nav-link">Iniciar sesión</a>
            </li>
          </ul>
        </div>
        <div class="col-lg-1 col-sm-12">
          <ul class="nav">
            <li class="nav-item nav-button">
              <button class="btn-search">
                <img src="{% static 'core_application/img/search.png' %}" alt="search">
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>    
  </header>
  <main class="flex-fill">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="container foot">
      <div class="row footer-content line"></div>
      <div class="row footer-content">
        <div class="col-lg-9 col-sm-12">
              &copy;2024 Ice cubes | Todos los derechos reservados.
        </div>
        <div class="col-lg-3 col-sm-12 social-icons">
          <a href=""><img src="{% static 'core_application/img/facebook.png' %}" alt="facebook"></a>
          <a href=""><img src="{% static 'core_application/img/instagram.png' %}" alt="facebook"></a>
          <a href="https://github.com/JuanSobalvarro/SGD.git"><img src="{% static 'core_application/img/github.png' %}" alt="Github"></a>
        </div>
      </div>
    </div>
  </footer>
  <script src=" {% static 'core_application/scripts/app.js' %} "></script>
  <script src=" {% static 'core_application/scripts/search.js' %} "></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
